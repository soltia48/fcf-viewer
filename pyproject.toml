[project]
name = "fcf-viewer"
version = "0.1.0"
description = ""
authors = [
    {name = "KIRISHIKI Yudai", email = "yudai.kirishiki@protonmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "nfcpy",
]
packages = [
    {include = "fcf_viewer"}
